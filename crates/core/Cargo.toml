[package]
name = "keeplight-core"
description = "OpenRGB SDK client and device model for Keeplight"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# A fake OpenRGB server for tests and the smoke tests' example binary.
testing = []

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# The agent-interface kit (src/agent_kit, copied from jamarq-agent-kit) and
# Keeplight's MCP server. Since kit 8 the server is the kit's own: stdio
# only, synchronous, no HTTP, TLS or network transport, and no rmcp or tokio.
sha2 = "0.11"
schemars = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_Services", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[[example]]
name = "fake-openrgb"
required-features = ["testing"]
