name: Main build

# The release's Windows build of a main commit, for Atlas's "Reinstall on
# JASON-PC": the same tests and scripts/package.ps1 as release.yml, with the
# version stamped <workspace version>+main.<sha7>. Main carries the last
# released version, so a main build of 0.2.0 is 0.2.0+main.<sha7>, and its
# update notice offers only a newer release (crates/core/src/update.rs).
#
# Nothing is published: no tag, no GitHub release, no feed. The installer and
# its checksum are a workflow artifact named keeplight-main-<full sha>, kept
# for 7 days. The repository is public, so any signed-in GitHub user can
# download it; Atlas checks the run's branch, commit and digest before use.
#
# Started from Atlas's window (or the Actions tab) on main only. Atlas
# installs with /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER and
# must wait on the installer process alone: the installer restarts the
# keeper when its sign-in switch is on, so waiting on its children hangs.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Test
        run: cargo test --workspace --locked

      # Only the workspace's own version changes: Cargo.toml's
      # [workspace.package] line and the three workspace entries in
      # Cargo.lock, refreshed offline. Every dependency stays locked.
      - name: Stamp the version
        id: stamp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $released = (cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json).packages |
              Where-Object name -eq 'keeplight' | Select-Object -ExpandProperty version
          if ($released -notmatch '^\d+\.\d+\.\d+$') { throw "workspace version $released is not MAJOR.MINOR.PATCH" }
          $version = "$released+main.$($env:GITHUB_SHA.Substring(0, 7))"

          $toml = Get-Content Cargo.toml -Raw
          $line = "(?m)^version = `"$([regex]::Escape($released))`"(?=\r?$)"
          if (([regex]::Matches($toml, $line)).Count -ne 1) { throw 'expected one workspace version line in Cargo.toml' }
          $toml = [regex]::Replace($toml, $line, "version = `"$version`"")
          [IO.File]::WriteAllText((Join-Path $PWD 'Cargo.toml'), $toml)

          cargo update --workspace --offline
          if ($LASTEXITCODE -ne 0) { throw 'cargo update --workspace failed' }
          $changed = @(git diff --name-only | Sort-Object)
          if (($changed -join ',') -ne 'Cargo.lock,Cargo.toml') { throw "the stamp changed $($changed -join ', ')" }
          $lock = git diff --numstat -- Cargo.lock
          if ($lock -notmatch '^3\s+3\s') { throw "the stamp changed more than the workspace entries in Cargo.lock: $lock" }
          git diff

          "version=$version" >> $env:GITHUB_OUTPUT
          "Stamped $version" >> $env:GITHUB_STEP_SUMMARY

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Read the version back
        shell: pwsh
        env:
          VERSION: ${{ steps.stamp.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $released = $env:VERSION.Split('+')[0]
          $setup = Get-Item "dist/Keeplight-$env:VERSION-setup.exe"
          # Inno Setup pads its version-info strings with spaces.
          $product = $setup.VersionInfo.ProductVersion.Trim([char]0, ' ')
          $file = $setup.VersionInfo.FileVersion.Trim([char]0, ' ')
          "Installer: $($setup.Name), product version $product, file version $file"
          if ($product -ne $env:VERSION) { throw "the installer's product version is $product" }
          if ($file -ne $released) { throw "the installer's file version is $file" }

          $cli = & target/release/keeplight-cli.exe version
          "Command line: $cli"
          if ($cli -ne "keeplight-cli $env:VERSION") { throw "keeplight-cli version says $cli" }

          $app = (Get-Item target/release/keeplight.exe).VersionInfo.ProductVersion.Trim([char]0, ' ')
          "Window: product version $app"
          if ($app -ne $env:VERSION) { throw "keeplight.exe's product version is $app" }

      # The installer and its line of package.ps1's checksums; the portable
      # zip stays out of the artifact.
      - name: Collect the installer
        shell: pwsh
        env:
          VERSION: ${{ steps.stamp.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "Keeplight-$env:VERSION-setup.exe"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "dist/$name" out/
          $sum = Get-Content dist/SHA256SUMS.txt | Where-Object { $_ -match "  $([regex]::Escape($name))$" }
          if (@($sum).Count -ne 1) { throw "no checksum for $name" }
          Set-Content -Path out/SHA256SUMS.txt -Value $sum -Encoding ascii
          $sum

      - name: Upload the installer
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: keeplight-main-${{ github.sha }}
          path: out/
          retention-days: 7
          if-no-files-found: error

      - name: Summary
        shell: pwsh
        env:
          VERSION: ${{ steps.stamp.outputs.version }}
          ARTIFACT: keeplight-main-${{ github.sha }}
          DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          "Artifact $env:ARTIFACT (digest sha256:$env:DIGEST), Keeplight-$env:VERSION-setup.exe, kept 7 days." >> $env:GITHUB_STEP_SUMMARY
