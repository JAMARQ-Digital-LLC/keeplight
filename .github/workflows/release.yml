name: Release

# A release goes out only when the owner asks for one (owner, 2026-11-18):
# the owner starts this workflow on main from the Actions tab. It tests and
# packages main's head with scripts/package.ps1, tags that commit
# v<workspace version>, and attaches the portable zip, the per-user installer
# and their checksums to a draft GitHub release for review. It refuses a
# version that already has a tag or a release; bump the version in its own
# pull request first. Nothing reaches the update feed until the owner
# publishes the draft (publish-feed.yml). Builds of main between releases
# come from main-build.yml.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  package:
    name: Package
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Stop unless started on main
        if: ${{ github.ref != 'refs/heads/main' }}
        shell: bash
        run: |
          echo "::error::Releases are made from main; this run is on $GITHUB_REF."
          exit 1

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Read the version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json).packages |
              Where-Object name -eq 'keeplight' | Select-Object -ExpandProperty version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "workspace version $version is not MAJOR.MINOR.PATCH" }
          $tag = "v$version"
          if (git ls-remote --tags origin "refs/tags/$tag") { throw "$tag is already tagged; bump the version first" }
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "a release named $tag already exists (perhaps a draft)" }
          $global:LASTEXITCODE = 0
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Test
        run: cargo test --workspace --locked

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1

      # Tagged only once the build has passed, so a failed run leaves no tag.
      - name: Tag main's head
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$env:TAG" dist/*.zip dist/*.exe dist/SHA256SUMS.txt --verify-tag --draft --title "Keeplight $env:TAG" --generate-notes
